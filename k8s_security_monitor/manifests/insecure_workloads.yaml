apiVersion: v1
kind: Pod
metadata:
  name: insecure-root-pod
  namespace: default
  labels:
    test: injected-fault
spec:
  containers:
    - name: web
      image: nginx:1.21
      securityContext:
        privileged: true
        runAsUser: 0
  hostNetwork: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overly-permissive-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-cluster-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
